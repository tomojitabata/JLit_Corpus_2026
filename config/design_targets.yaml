# =============================================================================
# JLit コーパス 設計目標
# -----------------------------------------------------------------------------
# **何を目指して増補するか**を数値で書いた表。`scripts/check_balance.py` が
# この表と現状を突き合わせ，達していない項目を列挙する。
#
# なぜ数値で書くのか
#   「バランスの良いコーパス」は，数値にしない限り検証できない。どの作家が
#   何割を占めてよいのかを決めずに増補すると，増やしたことで却って偏る。
#   2026-09-26 の点検では，分析対象 101 点・621 万語に対し
#   宮本百合子 12.1%・森鴎外 11.8% に対して夏目漱石 4.7% であった。
#
# ⚠ **目標は達成義務ではない。** 青空文庫に無いものは入らない（保護期間中の
#   作家，未登録の作品）。達していない項目は「まだ埋まっていない穴」として
#   報告し続け，論文や授業で**制約として明示する**ためにある。
#
# 目標を変えたときは logs/ に日付つきで写しを残すこと。
# =============================================================================

meta:
  decided: "2026-09-26"
  basis: 分析対象 101 点・6,211,023 語（completeness が superseded/merged/too_short の行を除く）
  note: 割合はすべて 0–1（語数に占める比）。百分率ではない

# --- 集中の上限 --------------------------------------------------------------
# G² も PCA も word2vec も「誰が書いたか」を見ない。1作家が語数の2割を
# 占めれば，その作家の文体が「時代の特徴」として出てくる。
concentration:
  max_author_share: 0.12      # 1作家の語数がコーパス全体に占める割合の上限
  max_work_share: 0.08        # 1作品の語数が全体に占める割合の上限
  max_author_share_in_band: 0.40   # 各時代区分の中で，最大の作家が占める割合の上限
  # 収録で下げきれない分は分析時に均す。両方が要る：
  #   06_build_datasets.py --balance --max-per-author
  #   08_word2vec_diachronic.py --balance

# --- 時代区分ごとの量 --------------------------------------------------------
# 通時の学習（Step 6）は period5 のスライスごとにモデルを作る。スライスの
# 語数が桁違いだと，小さいスライスのモデルだけ語彙も近傍も貧しくなり，
# 「時代が違う」のか「標本が少ない」のかが区別できなくなる。
bands:
  slice_column: period5       # 学習に使う列（6区分の period を畳んだもの）
  describe_column: period     # 記述統計に使う列（6区分のまま）
  min_tokens_per_band: 500000       # 1スライスの下限
  max_min_ratio: 3.0          # 最大スライス ÷ 最小スライス の上限
  bands5:                     # period → period5 の対応（00_build_metadata_v2.BAND5 と同一）
    "1_明治前期(〜1886)": "1_明治前期〜中期(〜1899)"
    "2_明治中期(1887-1899)": "1_明治前期〜中期(〜1899)"

# --- 作者の性別 --------------------------------------------------------------
# 現状 女性 23.3%（20 点）。ただし宮本百合子1人で女性語数の過半を占め，
# 昭和戦後は語数の 59% が女性である。**つまり性別と時代が交絡している。**
# 青空文庫で公開されている女性作家は短篇・評論が中心で，語数比を大きく
# 動かすことはできない。そこで**率ではなく分布**を目標にする。
sex:
  min_female_authors_per_band: 2    # 各 period5 に女性作家を2人以上
  min_female_share: 0.20            # 語数比の下限（現状維持の確認用）
  note: 率の上積みではなく，各時代に散らすことを目標とする

# --- 作家ごとの点数 ----------------------------------------------------------
# 「鴎外7点に対し漱石4点」のような，文学史的に釣り合わない配分を防ぐ。
authors:
  canonical_min_works:        # この作家は最低この点数を収める
    夏目漱石: 9
    森鴎外: 7
  note: 漱石は 2026-09-26 に 4 → 9 点へ増補を決定（明治後期3点・大正2点）

# --- 参考：現状との差は check_balance.py が出す -------------------------------
# python3 scripts/check_balance.py
# python3 scripts/check_balance.py --quiet     # 達していない項目だけ
